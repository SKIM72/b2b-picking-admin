<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>B2B 출고 시스템 - 로그인</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5A73E4",
                        "primary-hover": "#4a62d4",
                        "surface": "#f8fafd",
                        "on-surface": "#1a1c1e",
                        "on-surface-variant": "#44474e",
                        "outline": "#74777f",
                        "outline-variant": "#c4c6cf",
                        "surface-container": "#eeeeee",
                    },
                    fontFamily: {
                        "sans": ["Inter", "Noto Sans KR", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "8px",
                        "lg": "8px",
                        "xl": "12px",
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #d9e2ff 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-on-surface">
    <div class="w-full max-w-[440px]">
        <div class="glass-card rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.1)] p-8 md:p-10">
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-primary/10 rounded-2xl mb-6">
                    <span class="material-symbols-outlined text-primary text-4xl" data-icon="inventory_2">inventory_2</span>
                </div>
                <h1 class="text-2xl font-extrabold text-on-surface tracking-tight mb-2">B2B 출고 시스템</h1>
                <h2 class="text-lg font-medium text-on-surface-variant" id="auth-title">로그인</h2>
            </div>
            
            <div id="auth-form">
                <form class="space-y-5" id="login-form">
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-on-surface-variant ml-1" for="login-email">이메일</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="mail">mail</span>
                            <input class="w-full pl-11 pr-4 py-3.5 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200 outline-none text-on-surface placeholder:text-outline/60" id="login-email" placeholder="이메일을 입력하세요" required type="email"/>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-on-surface-variant ml-1" for="login-password">비밀번호</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="lock">lock</span>
                            <input class="w-full pl-11 pr-4 py-3.5 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200 outline-none text-on-surface placeholder:text-outline/60" id="login-password" placeholder="비밀번호를 입력하세요" required type="password"/>
                        </div>
                    </div>
                    <button class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-4 rounded-lg shadow-lg shadow-primary/25 transition-all duration-200 active:scale-[0.98] mt-4 flex items-center justify-center gap-2" type="submit">
                        로그인
                    </button>
                </form>
                <p class="text-red-500 text-sm text-center mt-4 min-h-[1.25rem] font-medium" id="auth-message"></p>
                <div class="mt-10 pt-8 border-t border-outline-variant/30 text-center">
                    <p class="text-on-surface-variant text-sm mb-3">계정이 없으시거나 비밀번호를 잊으셨나요?</p>
                    <div class="flex justify-center items-center gap-3">
                        <a class="inline-block text-primary font-bold text-sm hover:underline hover:text-primary-hover transition-colors" href="#" id="show-signup">
                            회원가입
                        </a>
                        <span class="text-outline-variant/50 text-xs">|</span>
                        <a class="inline-block text-primary font-bold text-sm hover:underline hover:text-primary-hover transition-colors" href="#" id="show-reset-password">
                            비밀번호 찾기
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-8 text-center">
            <p class="text-xs font-medium text-outline uppercase tracking-widest opacity-60">B2B Picking System v2.0.3</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
</body>
</html>
