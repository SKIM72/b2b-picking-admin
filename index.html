<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>B2B 출고 시스템 - 관리자 페이지</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="admin.style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5A73E4",
                        "surface": "#F8FAFC",
                        "on-surface": "#0F172A",
                        "outline-variant": "#E2E8F0"
                    },
                    fontFamily: {
                        "sans": ["Inter", "Noto Sans KR", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
    <header class="bg-white border-b border-outline-variant h-16 flex items-center justify-between px-6 sticky top-0 z-40 shadow-sm">
        <div class="flex items-center gap-4">
            <h1 class="text-primary font-extrabold text-xl tracking-tight cursor-pointer" id="home-button">B2B 출고 시스템 - 관리자</h1>
        </div>
        <div class="flex items-center gap-4 header-user-info">
            <div class="flex items-center gap-3 mr-2">
                <span class="text-sm font-medium text-slate-600" id="current-user-email"></span>
                <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center">
                    <span class="material-symbols-outlined text-slate-400 text-sm">person</span>
                </div>
            </div>
            <button class="px-3 py-1.5 text-xs font-bold text-slate-500 border border-slate-200 rounded-md hover:bg-slate-50 transition-colors" id="logout-button">로그아웃</button>
        </div>
    </header>

    <nav class="bg-white border-b border-outline-variant px-6 flex gap-1">
        <button id="nav-picking-status">출고 현황</button>
        <button id="nav-batch-management">출고 업로드</button>
        <button id="nav-products">상품 마스터</button>
        <button id="nav-channels">채널 관리</button>
        <button id="nav-users">사용자 관리</button>
    </nav>

    <main id="content-area" class="flex-1 p-8 max-w-7xl mx-auto w-full space-y-6">
    </main>

    <div id="batch-summary-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center" style="display: none;">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="px-6 py-4 border-b border-outline-variant flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-900">출고 차수 상세</h2>
                <button class="modal-close-btn w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition-colors">
                    <span class="material-symbols-outlined text-slate-500 pointer-events-none">close</span>
                </button>
            </div>
            <div class="p-6">
                <div class="overflow-hidden rounded border border-outline-variant">
                    <table class="w-full text-left text-sm" id="batch-summary-table">
                        <thead class="bg-slate-50 border-b border-outline-variant text-[10px] uppercase font-black text-slate-400 tracking-widest">
                            <tr>
                                <th class="px-4 py-3">차수</th>
                                <th class="px-4 py-3">상태</th>
                                <th class="px-4 py-3 text-right">주문(건)</th>
                                <th class="px-4 py-3 text-right">완료(건)</th>
                                <th class="px-4 py-3">진행률</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.script.js" defer></script>
</body>
</html>
